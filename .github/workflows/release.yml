name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read brand
        id: brand
        run: |
          {
            echo "appId=$(jq -r .appId brand.json)"
            echo "displayName=$(jq -r .displayName brand.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Validate tag matches version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(jq -r '.version' appinfo.json)
          [ "$TAG" = "v$VERSION" ] || { echo "Tag $TAG does not match version v$VERSION"; exit 1; }
          echo "Version: $VERSION"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build IPK
        run: |
          sh tools/build-ipk.sh

      - name: Generate manifest.json
        run: |
          node tools/gen-manifest.js ${{ steps.brand.outputs.appId }}_*.ipk manifest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.brand.outputs.appId }}_*.ipk
            manifest.json
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Update repo.json
        run: |
          # Fetch and checkout main branch
          git fetch origin main
          git checkout -B main origin/main
          
          # Regenerate repo.json from the manifest built above
          jq '{packages: [{id, title, iconUri, shortDescription: .appDescription, sourceUrl, manifest: .}]}' manifest.json > repo.json

          # Commit and push to main
          git config user.name "${{ steps.brand.outputs.displayName }} CI"
          git config user.email "ci@${{ steps.brand.outputs.appId }}"
          git add repo.json
          git commit -m "chore(ci): update repo.json for v$(jq -r '.version' appinfo.json) [skip ci]" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
