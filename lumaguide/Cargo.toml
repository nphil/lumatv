[package]
name = "lumaguide"
description = "An antenna TV guide from online listings picked by zip code (a Plex server's, Schedules Direct's, the Gracenote grid's), matched to the broadcast channels and merged with the broadcast guide: the engine, with no host in it"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[dependencies]
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Schedules Direct takes the SHA-1 of the password, in hex.
sha1 = "0.10"
