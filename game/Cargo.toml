# LumaGame's own workspace: the pure core that the app, every engine and the tests depend on. A crate added under crates/ joins by
# being there. An engine with heavy or patched dependencies keeps a workspace of its own (as gfn/engine does for OpenNOW), so this
# one builds and tests in seconds and its lock file names nothing such an engine needs.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
