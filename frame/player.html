<!doctype html>
<!-- LumaGame's player (player.js). The body stays clear until the player draws, so nothing flashes in the frame's pane. -->
<html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Player</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #player, video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  video { object-fit: contain; }
</style></head>
<body><script src="player.js"></script></body></html>
