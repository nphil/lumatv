[package]
name = "lumatv-helper"
description = "LumaTV's native helper: loopback JSON API, settings, saved-first weather and news, receiver status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "lumatv_helper"
path = "src/lib.rs"

[[bin]]
name = "lumatv-helper"
path = "src/main.rs"

[dependencies]
fetch.workspace = true
settings-schema.workspace = true
plugin-api.workspace = true
service-api.workspace = true
ha-link.workspace = true
ha-bridge.workspace = true
esphome-api.workspace = true
mdns.workspace = true
lumatv-ambient.workspace = true
lumatv-placement.workspace = true
lumatv-denon.workspace = true
lumatv-feeds.workspace = true
libc.workspace = true
parking_lot.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
lumashow-sdk.workspace = true
plugin-home-assistant.workspace = true
ha-link = { workspace = true, features = ["testing"] }
ha-bridge = { workspace = true, features = ["testing"] }
fetch = { workspace = true, features = ["testing"] }
