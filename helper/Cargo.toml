[workspace]
resolver = "3"
members = ["app", "feeds", "denon", "privacy", "plugins/home-assistant"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[workspace.dependencies]
# LumaShow OS crates, shared and never forked: a path dependency on the sibling checkout
# (/data/home/LumaShow/wt/lumatv, the worktree the TV builds against). helper/build.sh checks that it is there.
fetch = { path = "../../LumaShow/wt/lumatv/crates/fetch" }
settings-schema = { path = "../../LumaShow/wt/lumatv/crates/settings-schema" }
plugin-api = { path = "../../LumaShow/wt/lumatv/crates/plugin-api" }
service-api = { path = "../../LumaShow/wt/lumatv/crates/service-api" }
lumashow-sdk = { path = "../../LumaShow/wt/lumatv/crates/lumashow-sdk" }
ha-link = { path = "../../LumaShow/wt/lumatv/crates/ha-link" }
ha-bridge = { path = "../../LumaShow/wt/lumatv/crates/ha-bridge" }
esphome-api = { path = "../../LumaShow/wt/lumatv/crates/esphome-api" }
mdns = { path = "../../LumaShow/wt/lumatv/crates/mdns" }
# The Home Assistant plugin itself, as a library: the host tests run the real plugin against the broker.
plugin-home-assistant = { path = "../../LumaShow/wt/lumatv/plugins/home-assistant" }

libc = "0.2"
parking_lot = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

lumatv-ambient = { path = "../ambient" }
lumatv-placement = { path = "../placement" }
lumatv-denon = { path = "denon" }
lumatv-feeds = { path = "feeds" }
lumatv-privacy = { path = "privacy" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
