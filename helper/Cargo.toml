[workspace]
resolver = "3"
members = ["app", "feeds", "denon", "privacy", "tuner", "remote", "plugins/home-assistant"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[workspace.dependencies]
# LumaShow OS crates, shared and never forked: a path dependency on the sibling checkout
# (/data/home/LumaShow/wt/lumatv, the worktree the TV builds against). helper/build.sh checks that it is there.
fetch = { path = "../../LumaShow/wt/lumatv/crates/fetch" }
# The weather view's radar and map engines (IEM NEXRAD and HRRR, RainViewer, Open-Meteo, OpenFreeMap): LumaShow's own, shared and never forked.
map = { path = "../../LumaShow/wt/lumatv/crates/map" }
settings-schema = { path = "../../LumaShow/wt/lumatv/crates/settings-schema" }
plugin-api = { path = "../../LumaShow/wt/lumatv/crates/plugin-api" }
service-api = { path = "../../LumaShow/wt/lumatv/crates/service-api" }
lumashow-sdk = { path = "../../LumaShow/wt/lumatv/crates/lumashow-sdk" }
ha-link = { path = "../../LumaShow/wt/lumatv/crates/ha-link" }
ha-bridge = { path = "../../LumaShow/wt/lumatv/crates/ha-bridge" }
rtsp-client = { path = "../../LumaShow/wt/lumatv/crates/rtsp-client" }
esphome-api = { path = "../../LumaShow/wt/lumatv/crates/esphome-api" }
mdns = { path = "../../LumaShow/wt/lumatv/crates/mdns" }
# The Home Assistant plugin itself, as a library: the host tests run the real plugin against the broker.
plugin-home-assistant = { path = "../../LumaShow/wt/lumatv/plugins/home-assistant" }

libc = "0.2"
log = "0.4"
parking_lot = "0.12"
sha2 = "0.10"
# The words on the tuner's slates, in the faces the theme names: the rasteriser the Rust UI draws its text with.
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# TLS (the Scrypted bridge, `app/src/scrypted/tls.rs`: the one certificate the owner pinned is the only trust): the `ring` provider is what the GFN
# engine already builds for this target; no certificate store, no aws-lc (cmake), no logging.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The phone remote's pairing KDF, datagram AEAD and randomness: the same `ring` rustls already builds.
ring = "0.17"

lumatv-ambient = { path = "../ambient" }
lumatv-placement = { path = "../placement" }
lumatv-saver = { path = "../saver" }
lumatv-denon = { path = "denon" }
lumatv-feeds = { path = "feeds" }
lumatv-privacy = { path = "privacy" }
# The antenna tuner as an HDHomeRun: the engine the helper's Live TV Tuner plugin runs, and a standalone app could.
lumatuner = { path = "tuner" }
# The Live TV guide from online listings by zip code: the engine the helper's Guide data plugin runs, and the UI lays over LG's guide.
lumaguide = { path = "../lumaguide" }
# The phone remote: pairing, the Noise session and pointer datagrams; the engine the helper's Phone remote plugin runs.
lumaremote = { path = "remote" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

# The phone remote's pairing key is 131,072 rounds of PBKDF2: 0.37 s in an unoptimised `ring`, which every pairing test pays twice.
[profile.dev.package.ring]
opt-level = 3
