[workspace]
resolver = "3"
members = ["app", "feeds", "denon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[workspace.dependencies]
# LumaShow OS crates, shared and never forked: a path dependency on the sibling checkout
# (/data/home/LumaShow/lumashow). helper/build.sh checks that it is there.
fetch = { path = "../../LumaShow/lumashow/crates/fetch" }
settings-schema = { path = "../../LumaShow/lumashow/crates/settings-schema" }
plugin-api = { path = "../../LumaShow/lumashow/crates/plugin-api" }
service-api = { path = "../../LumaShow/lumashow/crates/service-api" }
lumashow-sdk = { path = "../../LumaShow/lumashow/crates/lumashow-sdk" }
ha-link = { path = "../../LumaShow/lumashow/crates/ha-link" }
esphome-api = { path = "../../LumaShow/lumashow/crates/esphome-api" }
mdns = { path = "../../LumaShow/lumashow/crates/mdns" }

libc = "0.2"
parking_lot = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

lumatv-ambient = { path = "../ambient" }
lumatv-denon = { path = "denon" }
lumatv-feeds = { path = "feeds" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
