[package]
name = "lumatv-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "LumaShow's compositor renderer, session and scene as a library (vendored modules, see tools/sync-lumashow.sh), drawing to a GL window surface or an offscreen one"

[lib]
# The vendored modules' unit tests are LumaShow's and are not copied (tools/sync-lumashow.sh); this crate's tests are in tests/.
# No target builds the library under cfg(test): a lib is a bench by default, which `--all-targets` would compile.
test = false
doctest = false
bench = false

[dependencies]
compositor-protocol = { path = "../compositor-protocol" }
device-profile = { path = "../../../LumaShow/lumashow/crates/device-profile" }
mesh3d = { path = "../mesh3d" }
libc = "0.2"
parking_lot = "0.12"
serde_json = "1"
