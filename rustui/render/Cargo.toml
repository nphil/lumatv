[package]
name = "lumatv-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "LumaShow's compositor renderer, session and scene as a library (vendored modules, see tools/sync-lumashow.sh), drawing to a GL window surface or an offscreen one"

[dependencies]
compositor-protocol = { path = "../../../LumaShow/lumashow/crates/compositor-protocol" }
device-profile = { path = "../../../LumaShow/lumashow/crates/device-profile" }
mesh3d = { path = "../../../LumaShow/lumashow/crates/mesh3d" }
libc = "0.2"
parking_lot = "0.12"
