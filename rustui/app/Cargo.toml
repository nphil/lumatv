[package]
name = "lumatv-rustui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "LumaHome and the card app drawn with LumaShow's Rust UI toolkit as 64-bit Wayland clients of LG's compositor (phase 3 spike, then the first app)"

[dependencies]
lumatv-render = { path = "../render" }
ui = { path = "../lumashow-ui" }
compositor-protocol = { path = "../compositor-protocol" }
device-profile = { path = "../../../LumaShow/lumashow/crates/device-profile" }
libc = "0.2"
png = "0.17"
serde_json = "1"
jpeg-decoder = { version = "0.3", default-features = false }
image-webp = { version = "0.2", default-features = false }

[[bin]]
name = "lumatv-damage-bench"
path = "src/bin/damage_bench.rs"

# The card app: SAM's 32-bit launcher (stub/) starts it through gfx64/launch.sh; see docs/research/cardapp-result.md.
[[bin]]
name = "lumatv-card-app"
path = "src/bin/card.rs"
required-features = ["window"]

# The GeForce NOW app's UI: the feeder (the app's `main`, gfn/feeder) starts it through gfx64/launch.sh; see docs/research/gfn-app-result.md.
[[bin]]
name = "lumatv-gfn-app"
path = "src/bin/gfn.rs"
required-features = ["window"]

[features]
default = []
# the Wayland window (needs the Wayland client libraries at run time: the bundle's, on the set)
window = ["dep:wayland-client", "dep:wayland-backend", "dep:lumatv-wl-protocols", "dep:wayland-protocols"]

[dependencies.wayland-client]
version = "0.31"
optional = true

[dependencies.wayland-backend]
version = "0.3"
optional = true
features = ["client_system", "dlopen"]

[dependencies.lumatv-wl-protocols]
path = "../../compositor/crates/wl-protocols"
optional = true
default-features = false
features = ["client"]

[dependencies.wayland-protocols]
version = "0.32"
optional = true
features = ["client"]

# The host test of the card app runs its binary against LumaTV's compositor, in process, with the compositor's own test harness.
[dev-dependencies]
lumatv-compositor = { path = "../../compositor/crates/lumatv-compositor" }
wayland-server = "0.31"
parking_lot = "0.12"
jpeg-encoder = "0.7"
