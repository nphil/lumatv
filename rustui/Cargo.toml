[workspace]
resolver = "3"
members = ["render", "app", "tokens", "ui", "lumashow-ui", "compositor-protocol", "mesh3d"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = false
debug = "line-tables-only"

[profile.dev]
debug = "line-tables-only"
[profile.test]
opt-level = 2
debug = "line-tables-only"
