[package]
name = "lumatv-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "LumaTV's shell logic as a 64-bit process without GL: the screens over the compositor's UI channel and LumaShow's compositor protocol, drawn by the engine inside the compositor; the TV kit every screen is built from; a host harness that renders scenes on Mesa"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lumatv-ui"
path = "src/main.rs"

[dependencies]
lumatv-tokens = { path = "../tokens" }
lumatv-render = { path = "../render" }
lumatv-placement = { path = "../../placement" }
lumatv-saver = { path = "../../saver" }
# the guide data model and the merge of online listings over LG's (the Guide data plugin's)
lumaguide = { path = "../../lumaguide" }
ui = { path = "../lumashow-ui" }
compositor-protocol = { path = "../compositor-protocol" }
serde_json = "1"
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }
libc = "0.2"
unicode-segmentation = "1.12"
# the grid-fitted glyphs (kit/gridfit.rs): the automatic hinter, in Rust
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[dev-dependencies]
ui = { path = "../lumashow-ui", features = ["testing"] }
# examples/textcov.rs: the text study's coverage canvases
fontdue = "0.9"
