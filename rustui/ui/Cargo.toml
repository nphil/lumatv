[package]
name = "lumatv-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "LumaTV's shell logic as a 64-bit process without GL: the screens over the compositor's UI channel and LumaShow's compositor protocol, drawn by the engine inside the compositor; the TV kit every screen is built from; a host harness that renders scenes on Mesa"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lumatv-ui"
path = "src/main.rs"

[dependencies]
lumatv-tokens = { path = "../tokens" }
lumatv-render = { path = "../render" }
lumatv-placement = { path = "../../placement" }
ui = { path = "../../../LumaShow/lumashow/crates/ui" }
compositor-protocol = { path = "../../../LumaShow/lumashow/crates/compositor-protocol" }
serde_json = "1"
png = "0.17"
libc = "0.2"

[dev-dependencies]
ui = { path = "../../../LumaShow/lumashow/crates/ui", features = ["testing"] }
