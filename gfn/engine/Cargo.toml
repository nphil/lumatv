# The GeForce NOW stream engine for the TV: OpenNOW's native streamer (pinned below) with its platform crate replaced by one that
# feeds LG's video plane through lumatv-gfn-feeder and reads the controller from evdev. The pinned core is patched by package name
# to a vendored copy, which takes the TV's platform crate and a vendored transport by path; both copies list their changes in
# VENDORED.md. The binary's main is this workspace's own (crates/lumatv-gfn-streamer).
[workspace]
resolver = "2"
members = ["crates/opennow-streamer-platform", "crates/opennow-streamer-transport", "crates/lumatv-gfn-pad", "crates/lumatv-gfn-sendtap", "crates/lumatv-gfn-streamer", "crates/keyring"]
# Core's tests need upstream's desktop test runtime, so it is built through the patch below and not as a member.
exclude = ["crates/opennow-streamer-core"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
opennow-streamer-core = { git = "https://github.com/OpenCloudGaming/OpenNOW", rev = "a49b124ce31e87113fd4961f6a321fbf0ad1fdc5" }
opennow-streamer-protocol = { git = "https://github.com/OpenCloudGaming/OpenNOW", rev = "a49b124ce31e87113fd4961f6a321fbf0ad1fdc5" }
opennow-streamer-hid = { git = "https://github.com/OpenCloudGaming/OpenNOW", rev = "a49b124ce31e87113fd4961f6a321fbf0ad1fdc5" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lumagame-feeder = { path = "../../game/crates/lumagame-feeder" }
lumagame-recorder = { path = "../../game/crates/lumagame-recorder" }

# Upstream's streamer workspace patches these from its vendor/ tree; a git dependency does not carry its workspace's patches, so they
# are repeated here from the same revision.
[patch.crates-io]
str0m = { git = "https://github.com/OpenCloudGaming/OpenNOW", rev = "a49b124ce31e87113fd4961f6a321fbf0ad1fdc5" }
keyring = { path = "crates/keyring" }

[patch."https://github.com/OpenCloudGaming/OpenNOW"]
opennow-streamer-core = { path = "crates/opennow-streamer-core" }

# Stripped: a panic still names its file and line, and 60 MB of line tables would be most of the package.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
debug = false

[profile.dev]
debug = "line-tables-only"
