[package]
name = "opennow-streamer-transport"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT"
description = "OpenNOW's NVST/WebRTC transport, vendored with the TV's fixes (VENDORED.md)"

[dependencies]
aes = "0.8"
ctr = "0.9"
crc32fast = "1"
getrandom = "0.3"
ghash = "0.5"
hmac = "0.12"
mtu = "0.3"
opennow-streamer-hid.workspace = true
opennow-streamer-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
str0m = { version = "0.23", default-features = false, features = ["rust-crypto"] }
subtle = "2"
thiserror = "2"
