[package]
name = "opennow-streamer-core"
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false
description = "OpenNOW's streamer core, vendored with upstream fixes the TV needs (VENDORED.md)"

# Not a workspace member, so nothing is inherited; versions are upstream's workspace pins at the same revision.
[dependencies]
base64 = "0.22"
getrandom = "0.3"
opennow-streamer-platform = { path = "../opennow-streamer-platform" }
opennow-streamer-hid = { git = "https://github.com/OpenCloudGaming/OpenNOW", rev = "a49b124ce31e87113fd4961f6a321fbf0ad1fdc5" }
opennow-streamer-protocol = { git = "https://github.com/OpenCloudGaming/OpenNOW", rev = "a49b124ce31e87113fd4961f6a321fbf0ad1fdc5" }
opennow-streamer-transport = { path = "../opennow-streamer-transport" }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
