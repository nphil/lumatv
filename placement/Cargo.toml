[package]
name = "lumatv-placement"
description = "Where the overlay items sit (volume bar, mute mark, camera window, notification cards, toasts): the model, the layout editor's controller and the theme.json schema, with no toolkit in it"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
