[package]
name = "lumatv-ambient"
description = "Ambient light: picture zones to light colours, the Hue Entertainment (HueStream over DTLS) and WLED (DDP) outputs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[dependencies]
aes-gcm = "0.10"
getrandom = "0.2"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
