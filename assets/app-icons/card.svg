<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191724"/>
      <stop offset="100%" stop-color="#1f1d2e"/>
    </linearGradient>
    <linearGradient id="back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6c177" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#eb6f92" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4a7e7" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#907aa9" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0def4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e0def4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frontClip"><rect x="40" y="52" width="120" height="100" rx="22"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#191724" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="44" fill="url(#bg)"/>
  <rect x="4" y="4" width="192" height="192" rx="40" fill="none" stroke="#26233a" stroke-width="2"/>

  <!-- the card behind the window -->
  <rect x="56" y="38" width="112" height="100" rx="24" fill="url(#back)" transform="rotate(8 112 88)"/>

  <!-- the window: title bar with its three controls, a grid of content -->
  <g filter="url(#drop)"><rect x="40" y="52" width="120" height="100" rx="22" fill="url(#front)"/></g>
  <g clip-path="url(#frontClip)">
    <path d="M40 60 L124 48 L100 88 L40 98 Z" fill="url(#sheen)"/>
    <rect x="40" y="52" width="120" height="30" fill="#e0def4" fill-opacity="0.16"/>
    <path d="M40 82H160" stroke="#e0def4" stroke-opacity="0.38" stroke-width="1.5"/>
  </g>
  <circle cx="58" cy="67" r="4.2" fill="#eb6f92"/>
  <circle cx="72" cy="67" r="4.2" fill="#f6c177"/>
  <circle cx="86" cy="67" r="4.2" fill="#9ccfd8"/>
  <rect x="54" y="94" width="42" height="22" rx="8" fill="#e0def4" fill-opacity="0.82"/>
  <rect x="104" y="94" width="42" height="22" rx="8" fill="#e0def4" fill-opacity="0.34"/>
  <rect x="54" y="122" width="42" height="18" rx="8" fill="#e0def4" fill-opacity="0.34"/>
  <rect x="104" y="122" width="42" height="18" rx="8" fill="#e0def4" fill-opacity="0.34"/>
  <rect x="40" y="52" width="120" height="100" rx="22" fill="none" stroke="#e0def4" stroke-opacity="0.45" stroke-width="2"/>
</svg>
