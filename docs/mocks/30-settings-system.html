<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>LumaTV · Settings · System</title>
<link rel="stylesheet" href="lucent.css"><link rel="stylesheet" href="help.css">
</head>
<body>
<div class="wall"></div>

<div class="pane topbar">
  <i data-ic="chevron-left" class="ic"></i>
  <span class="title">Settings</span>
  <span class="spacer"></span>
  <span class="status"><i data-ic="wifi"></i><i data-ic="mouse-pointer-2"></i></span>
  <span class="time num">9:58 PM</span>
</div>

<nav class="pane rail" data-open="system" aria-label="Settings sections"></nav>

<main class="pane page">
  <div class="page-head">
    <h1>System</h1>
    
  </div>
  <div class="tabs" role="tablist">
    <div class="tab focusable" role="tab" aria-selected="true">General</div>
    <div class="tab focusable" role="tab" aria-selected="false">Power</div>
    <div class="tab focusable" role="tab" aria-selected="false">OLED care</div>
    <div class="tab focusable" role="tab" aria-selected="false">Accessibility</div>
    <div class="tab focusable" role="tab" aria-selected="false">About</div>
  </div>
  <div class="page-body">
    <div class="rows">
      <div class="row focusable no-line" tabindex="0" data-autofocus>
        <div class="lead"><i data-ic="languages"></i></div>
        <div class="text"><div class="t">Language<i data-ic="info" class="info"></i></div></div>
        <div class="v">English (US) <i data-ic="chevron-right"></i></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="clock"></i></div>
        <div class="text"><div class="t">Time zone<i data-ic="info" class="info"></i></div></div>
        <div class="v">Automatic <i data-ic="chevron-right"></i></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="power"></i></div>
        <div class="text"><div class="t">Turn off when idle<i data-ic="info" class="info"></i></div></div>
        <span class="seg" role="radiogroup"><span role="radio" aria-selected="false">2 h</span><span role="radio" aria-selected="true">4 h</span><span role="radio" aria-selected="false">Off</span></span>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="zap"></i></div>
        <div class="text"><div class="t">Quick Start+<i data-ic="info" class="info"></i></div></div>
        <div class="toggle" role="switch" aria-checked="true"></div>
      </div>
    </div>
    <div class="rows">
      <div class="row focusable no-line" tabindex="0">
        <div class="lead"><i data-ic="house"></i></div>
        <div class="text"><div class="t">Hold Home for LG’s Home<i data-ic="info" class="info"></i></div></div>
        <div class="toggle" role="switch" aria-checked="true"></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="download"></i></div>
        <div class="text"><div class="t">LumaTV update</div></div>
        <div class="v">Up to date <i data-ic="chevron-right"></i></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="square-arrow-out-up-right"></i></div>
        <div class="text"><div class="t">Open LG settings</div></div>
        <div class="v"><i data-ic="chevron-right"></i></div>
      </div>
    </div>
  </div>
</main>

<script src="icons.js"></script>
<script src="mock.js"></script>
</body>
</html>
