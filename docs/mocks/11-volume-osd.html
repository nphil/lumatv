<!doctype html>
<html lang="en" data-theme="dark" data-video>
<head>
<meta charset="utf-8">
<title>LumaTV · Volume</title>
<link rel="stylesheet" href="lucent.css">
<style>
  .frame { background-image: url("img/still.jpg"); }
  /* one display, a dozen states: the Denon on the set (0 to 98, default; the mark of its format when it says one: ?v=atmos, ?v=dtsx, ?v=format for Dolby
     Audio, and plain stereo with none: ?v=stereo), its decibel scale (?v=db), muted (?v=muted), the mark that stays while muted (?v=mark), the TV's own
     volume where there is no receiver (?v=tv, ?v=arc), and nothing to read (?v=offline). The number and its bar; no words, and a format with no mark
     (PCM, stereo, multichannel) shows nothing at the end. DTS:X is shown over a bright frame, the worst one for the dark glass. */
  [data-v="dtsx"] .frame { background-image: url("img/art-hokusai.jpg"); }
  .st { display: none; }
  html:not([data-v]) .st.abs, [data-v="stereo"] .st.abs, [data-v="atmos"] .st.atmos, [data-v="dtsx"] .st.dtsx, [data-v="format"] .st.format, [data-v="db"] .st.db, [data-v="muted"] .st.muted, [data-v="mark"] .st.mark, [data-v="tv"] .st.tv, [data-v="arc"] .st.arc, [data-v="offline"] .st.offline { display: flex; }
</style>
</head>
<body>
<div class="frame"></div>

<!-- the receiver: its own level, a whole number; also what plain stereo (PCM) looks like: no mark -->
<div class="st abs overlay osd" role="status" aria-live="polite">
  <span class="num">47</span>
  <div class="htrack"><i style="width:48%"></i></div>
</div>

<!-- the receiver, and what it is playing: the mark of the format, in the bar's ink, named in words for a reader that cannot see it -->
<div class="st atmos overlay osd" role="status" aria-live="polite">
  <span class="num">47</span>
  <div class="htrack"><i style="width:48%"></i></div>
  <i class="logo atmos" role="img" aria-label="Dolby Atmos"></i>
</div>
<div class="st dtsx overlay osd" role="status" aria-live="polite">
  <span class="num">47</span>
  <div class="htrack"><i style="width:48%"></i></div>
  <i class="logo dtsx" role="img" aria-label="DTS:X"></i>
</div>
<div class="st format overlay osd" role="status" aria-live="polite">
  <span class="num">47</span>
  <div class="htrack"><i style="width:48%"></i></div>
  <i class="logo dolby" role="img" aria-label="Dolby Digital+ · Surround"></i>
</div>

<!-- the same, counting in decibels: the number, no unit -->
<div class="st db overlay osd" role="status" aria-live="polite">
  <span class="num">-35</span>
  <div class="htrack"><i style="width:46%"></i></div>
</div>

<!-- muted: a slashed speaker where the number was; the bar stays, dimmed; no word -->
<div class="st muted overlay osd" role="status" aria-label="Muted" aria-live="polite">
  <i class="ic" data-ic="volume-x"></i>
  <div class="htrack"><i style="width:47%"></i></div>
</div>

<!-- what stays once the bar has gone, until the sound is back: LG's bubble, a speaker with a slash; it moves 94 px sideways every ten seconds, between three places (here the middle one) -->
<div class="st mark overlay osd-mark" role="status" aria-label="Muted" aria-live="polite">
  <i class="ic" data-ic="volume-x"></i>
</div>

<!-- no receiver: the TV's own volume (here its speakers) -->
<div class="st tv overlay osd" role="status" aria-live="polite">
  <span class="num">18</span>
  <div class="htrack"><i style="width:18%"></i></div>
</div>

<!-- the sound goes out over ARC and the receiver is off: the TV's step count -->
<div class="st arc overlay osd" role="status" aria-live="polite">
  <span class="num">32</span>
  <div class="htrack"><i style="width:32%"></i></div>
</div>

<!-- nothing to read -->
<div class="st offline overlay osd" role="status" aria-live="polite">
  <span class="cap">Receiver not answering</span>
</div>

<script src="icons.js"></script>
<script src="mock.js"></script>
</body>
</html>
