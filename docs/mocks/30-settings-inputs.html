<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>LumaTV · Settings · Inputs &amp; devices</title>
<link rel="stylesheet" href="lucent.css"><link rel="stylesheet" href="help.css">
<style>.inrow .lead img{width:56px;height:56px;border-radius:16px}</style>
</head>
<body>
<div class="wall"></div>

<div class="pane topbar">
  <i data-ic="chevron-left" class="ic"></i>
  <span class="title">Settings</span>
  <span class="spacer"></span>
  <span class="status"><i data-ic="wifi"></i><i data-ic="mouse-pointer-2"></i></span>
  <span class="time num">9:54 PM</span>
</div>

<nav class="pane rail" data-open="inputs" aria-label="Settings sections"></nav>

<main class="pane page">
  <div class="page-head">
    <h1>Inputs &amp; devices</h1>
    
  </div>
  <div class="tabs" role="tablist">
    <div class="tab focusable" role="tab" aria-selected="true">Inputs</div>
    <div class="tab focusable" role="tab" aria-selected="false">HDMI</div>
    <div class="tab focusable" role="tab" aria-selected="false">Devices</div>
  </div>
  <div class="page-body">
    <div class="rows">
      <div class="row focusable no-line" tabindex="0">
        <div class="lead"><i data-ic="antenna"></i></div>
        <div class="text"><div class="t">Live TV<i data-ic="info" class="info"></i></div></div>
        <span class="seg" role="radiogroup"><span role="radio" aria-selected="true">Auto</span><span role="radio" aria-selected="false">Always</span><span role="radio" aria-selected="false">Hidden</span></span>
      </div>
      <div class="row focusable" tabindex="0" data-autofocus>
        <div class="lead"><i data-ic="tv-minimal-play"></i></div>
        <div class="text"><div class="t">HDMI 1 · Apple TV 4K</div></div>
        <span class="seg" role="radiogroup"><span role="radio" aria-selected="false">Auto</span><span role="radio" aria-selected="true">Always</span><span role="radio" aria-selected="false">Hidden</span></span>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="speaker"></i></div>
        <div class="text"><div class="t">HDMI 2 · Denon AVR-S760H</div></div>
        <span class="seg" role="radiogroup"><span role="radio" aria-selected="true">Auto</span><span role="radio" aria-selected="false">Always</span><span role="radio" aria-selected="false">Hidden</span></span>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="gamepad-2"></i></div>
        <div class="text"><div class="t">HDMI 3 · PlayStation 5</div></div>
        <span class="seg" role="radiogroup"><span role="radio" aria-selected="true">Auto</span><span role="radio" aria-selected="false">Always</span><span role="radio" aria-selected="false">Hidden</span></span>
      </div>
      <div class="row focusable disabled" tabindex="0">
        <div class="lead"><i data-ic="unplug"></i></div>
        <div class="text"><div class="t">HDMI 4 · Nothing connected</div></div>
        <span class="seg" role="radiogroup"><span role="radio" aria-selected="true">Auto</span><span role="radio" aria-selected="false">Always</span><span role="radio" aria-selected="false">Hidden</span></span>
      </div>
    </div>
    <div class="rows">
      <div class="row focusable no-line" tabindex="0">
        <div class="lead"><i data-ic="cable"></i></div>
        <div class="text"><div class="t">HDMI-CEC (SIMPLINK)<i data-ic="info" class="info"></i></div></div>
        <div class="toggle" role="switch" aria-checked="true"></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="square-arrow-out-up-right"></i></div>
        <div class="text"><div class="t">More in LG settings</div></div>
        <div class="v"><i data-ic="chevron-right"></i></div>
      </div>
    </div>
  </div>
</main>

<script src="icons.js"></script>
<script src="mock.js"></script>
</body>
</html>
