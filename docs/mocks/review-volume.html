<!doctype html>
<html lang="en" data-theme="dark" data-video>
<head>
<meta charset="utf-8">
<title>Proposal – Audio format left of volume (not installed)</title>
<link rel="stylesheet" href="lucent.css">
<style>
  .frame { background-image: url("img/still.jpg"); }
  [data-v="dtsx"] .frame { background-image: url("img/art-hokusai.jpg"); }
  .st { display: none; }
  html:not([data-v]) .st.stereo,
  [data-v="stereo"] .st.stereo,
  [data-v="atmos"] .st.atmos,
  [data-v="dts"] .st.dts,
  [data-v="dtsx"] .st.dtsx,
  [data-v="format"] .st.format,
  [data-v="dolby"] .st.format { display: flex; }
  .osd { height: auto; min-height: 58px; padding-block: 12px; }
  .osd .num { width: auto; min-width: 70px; line-height: 1.3; }
</style>
</head>
<body>
<div class="frame"></div>

<div class="st stereo overlay osd" role="status" aria-live="polite">
  <span class="num">47</span>
  <div class="htrack"><i style="width:48%"></i></div>
</div>
<div class="st atmos overlay osd" role="status" aria-live="polite">
  <i class="logo atmos" role="img" aria-label="Dolby Atmos"></i>
  <span class="num">47</span>
  <div class="htrack"><i style="width:48%"></i></div>
</div>
<div class="st dts overlay osd" role="status" aria-live="polite">
  <i class="logo dts" role="img" aria-label="DTS"></i>
  <span class="num">47</span>
  <div class="htrack"><i style="width:48%"></i></div>
</div>
<div class="st dtsx overlay osd" role="status" aria-live="polite">
  <i class="logo dtsx" role="img" aria-label="DTS:X"></i>
  <span class="num">47</span>
  <div class="htrack"><i style="width:48%"></i></div>
</div>
<div class="st format overlay osd" role="status" aria-live="polite">
  <i class="logo dolby" role="img" aria-label="Dolby Audio"></i>
  <span class="num">47</span>
  <div class="htrack"><i style="width:48%"></i></div>
</div>

<script src="icons.js"></script>
<script src="mock.js"></script>
</body>
</html>
