<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>LumaTV · Settings · Home &amp; look</title>
<link rel="stylesheet" href="lucent.css"><link rel="stylesheet" href="help.css">
</head>
<body>
<div class="wall"></div>

<div class="pane topbar">
  <i data-ic="chevron-left" class="ic"></i>
  <span class="title">Settings</span>
  <span class="spacer"></span>
  <span class="status"><i data-ic="wifi"></i><i data-ic="mouse-pointer-2"></i></span>
  <span class="time num">9:57 PM</span>
</div>

<nav class="pane rail" data-open="home" aria-label="Settings sections"></nav>

<main class="pane page">
  <div class="page-head">
    <h1>Home &amp; look</h1>
    
  </div>
  <div class="tabs" role="tablist">
    <div class="tab focusable" role="tab" aria-selected="true">Look</div>
    <div class="tab focusable" role="tab" aria-selected="false">Home</div>
    <div class="tab focusable" role="tab" aria-selected="false">Screensaver</div>
    <div class="tab focusable" role="tab" aria-selected="false">Standby</div>
  </div>
  <div class="page-body">
    <div class="rows">
      <div class="row focusable no-line" tabindex="0" data-autofocus>
        <div class="lead"><i data-ic="image"></i></div>
        <div class="text"><div class="t">Wallpaper</div></div>
        <div class="v">Aurora <i data-ic="chevron-right"></i></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="palette"></i></div>
        <div class="text"><div class="t">Dynamic tint<i data-ic="info" class="info"></i></div></div>
        <div class="toggle" role="switch" aria-checked="true"></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="moon"></i></div>
        <div class="text"><div class="t">Appearance<i data-ic="info" class="info"></i></div></div>
        <span class="seg" role="radiogroup"><span role="radio" aria-selected="true">Dark</span><span role="radio" aria-selected="false">Light</span><span role="radio" aria-selected="false">Auto</span></span>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="clock"></i></div>
        <div class="text"><div class="t">Clock on Home</div></div>
        <span class="seg" role="radiogroup"><span role="radio" aria-selected="true">Analogue</span><span role="radio" aria-selected="false">Digital</span><span role="radio" aria-selected="false">Off</span></span>
      </div>
    </div>
    <div class="rows">
      <div class="row focusable no-line" tabindex="0">
        <div class="lead"><i data-ic="waves"></i></div>
        <div class="text"><div class="t">Wallpaper motion</div></div>
        <div class="toggle" role="switch" aria-checked="true"></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="blend"></i></div>
        <div class="text"><div class="t">Glass depth</div></div>
        <span class="seg" role="radiogroup"><span role="radio" aria-selected="false">Flat</span><span role="radio" aria-selected="false">Normal</span><span role="radio" aria-selected="true">Deep</span></span>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="square-arrow-out-up-right"></i></div>
        <div class="text"><div class="t">More in LG settings</div></div>
        <div class="v"><i data-ic="chevron-right"></i></div>
      </div>
    </div>
  </div>
</main>

<script src="icons.js"></script>
<script src="mock.js"></script>
</body>
</html>
