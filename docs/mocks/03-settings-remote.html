<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>LumaTV · Settings · Remote &amp; pointer</title>
<link rel="stylesheet" href="lucent.css"><link rel="stylesheet" href="help.css">
</head>
<body>
<div class="wall"></div>

<div class="pane topbar">
  <i data-ic="chevron-left" class="ic"></i>
  <span class="title">Settings</span>
  <span class="spacer"></span>
  <span class="status"><i data-ic="wifi"></i><i data-ic="mouse-pointer-2"></i></span>
  <span class="time num">9:50 PM</span>
</div>

<nav class="pane rail" data-open="remote" aria-label="Settings sections"></nav>

<main class="pane page">
  <div class="page-head">
    <h1>Remote &amp; pointer</h1>
    
  </div>
  <div class="page-body" style="margin-top:10px">
    <div class="rows">
      <div class="group-label">Pointer</div>
      <div class="row focusable no-line" tabindex="0" data-autofocus>
        <div class="lead"><i data-ic="mouse-pointer-2"></i></div>
        <div class="text"><div class="t">Magic Remote pointer<i data-ic="info" class="info"></i></div></div>
        <div class="toggle" role="switch" aria-checked="true"></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="gauge"></i></div>
        <div class="text"><div class="t">Pointer speed</div></div>
        <div class="seg" role="radiogroup"><span class="focusable" role="radio" aria-selected="false">Slow</span><span class="focusable" role="radio" aria-selected="true">Normal</span><span class="focusable" role="radio" aria-selected="false">Fast</span></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="scan-eye"></i></div>
        <div class="text"><div class="t">Pointer size</div></div>
        <div class="seg" role="radiogroup"><span class="focusable" role="radio" aria-selected="false">Small</span><span class="focusable" role="radio" aria-selected="true">Medium</span><span class="focusable" role="radio" aria-selected="false">Large</span></div>
      </div>
      <div class="group-label">Buttons</div>
      <div class="row focusable no-line" tabindex="0">
        <div class="lead"><i data-ic="house"></i></div>
        <div class="text"><div class="t">Hold Home for LG’s Home<i data-ic="info" class="info"></i></div></div>
        <div class="toggle" role="switch" aria-checked="true"></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="hash"></i></div>
        <div class="text"><div class="t">Number keys open dock tiles<i data-ic="info" class="info"></i></div></div>
        <div class="toggle" role="switch" aria-checked="true"></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="square-arrow-out-up-right"></i></div>
        <div class="text"><div class="t">More in LG settings</div></div>
        <div class="v"><i data-ic="chevron-right"></i></div>
      </div>
    </div>
  </div>
</main>

<script src="icons.js"></script>
<script src="mock.js"></script>
</body>
</html>
