<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>LumaTV · Settings · Network</title>
<link rel="stylesheet" href="lucent.css"><link rel="stylesheet" href="help.css">
</head>
<body>
<div class="wall"></div>

<div class="pane topbar">
  <i data-ic="chevron-left" class="ic"></i>
  <span class="title">Settings</span>
  <span class="spacer"></span>
  <span class="status"><i data-ic="wifi"></i><i data-ic="mouse-pointer-2"></i></span>
  <span class="time num">9:55 PM</span>
</div>

<nav class="pane rail" data-open="network" aria-label="Settings sections"></nav>

<main class="pane page">
  <div class="page-head">
    <h1>Network</h1>
    
  </div>
  <div class="tabs" role="tablist">
    <div class="tab focusable" role="tab" aria-selected="true">Wi-Fi</div>
    <div class="tab focusable" role="tab" aria-selected="false">Wired</div>
    <div class="tab focusable" role="tab" aria-selected="false">Details</div>
  </div>
  <div class="page-body">
    <div class="rows">
      <div class="row focusable no-line" tabindex="0">
        <div class="lead"><i data-ic="wifi"></i></div>
        <div class="text"><div class="t">Wi-Fi</div></div>
        <div class="toggle" role="switch" aria-checked="true"></div>
      </div>
      <div class="row focusable" tabindex="0" data-autofocus>
        <div class="lead"><i data-ic="house-wifi"></i></div>
        <div class="text"><div class="t">Nate’s Home</div></div>
        <div class="v"><span class="chip on"><span class="dot"></span>Connected</span></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="signal"></i></div>
        <div class="text"><div class="t">Other networks</div></div>
        <div class="v">3 nearby <i data-ic="chevron-right"></i></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="network"></i></div>
        <div class="text"><div class="t">IP address</div></div>
        <div class="v">Automatic <i data-ic="chevron-right"></i></div>
      </div>
    </div>
      <div class="group-label">Network features</div>
    <div class="rows">
      <div class="row focusable no-line" tabindex="0">
        <div class="lead"><i data-ic="power"></i></div>
        <div class="text"><div class="t">Wake from the network<i data-ic="info" class="info"></i></div></div>
        <div class="toggle" role="switch" aria-checked="true"></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="square-arrow-out-up-right"></i></div>
        <div class="text"><div class="t">More in LG settings</div></div>
        <div class="v"><i data-ic="chevron-right"></i></div>
      </div>
    </div>
  </div>
</main>

<script src="icons.js"></script>
<script src="mock.js"></script>
</body>
</html>
