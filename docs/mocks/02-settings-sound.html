<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>LumaTV · Settings · Sound</title>
<link rel="stylesheet" href="lucent.css"><link rel="stylesheet" href="help.css">
</head>
<body>
<div class="wall"></div>

<div class="pane topbar">
  <i data-ic="chevron-left" class="ic"></i>
  <span class="title">Settings</span>
  <span class="spacer"></span>
  <span class="status"><i data-ic="wifi"></i><i data-ic="mouse-pointer-2"></i></span>
  <span class="time num">9:49 PM</span>
</div>

<nav class="pane rail" data-open="sound" aria-label="Settings sections"></nav>

<main class="pane page">
  <div class="page-head">
    <h1>Sound</h1>
    
  </div>
  <div class="tabs" role="tablist">
    <div class="tab focusable" role="tab" aria-selected="true">Output</div>
    <div class="tab focusable" role="tab" aria-selected="false">Mode</div>
    <div class="tab focusable" role="tab" aria-selected="false">Advanced</div>
  </div>
  <div class="page-body">
    <div class="rows">
      <div class="row focusable no-line" tabindex="0">
        <div class="lead"><i data-ic="speaker"></i></div>
        <div class="text"><div class="t">Sound out<i data-ic="info" class="info"></i></div></div>
        <div class="v">Denon AVR-S760H <i data-ic="chevron-right"></i></div>
      </div>
      <div class="row focusable" tabindex="0" data-autofocus>
        <div class="lead"><i data-ic="volume-2"></i></div>
        <div class="text"><div class="t">Receiver volume</div></div>
        <div class="slider" aria-label="Receiver volume"><i data-ic="volume-1"></i><div class="track"><div class="fill" style="width:42%"></div><div class="thumb" style="left:42%"></div></div><i data-ic="volume-2"></i></div>
        <div class="v num" style="min-width:64px;justify-content:flex-end;color:var(--lu-ink)">42</div>
      </div>
      <div class="row focusable disabled" tabindex="0" aria-disabled="true">
        <div class="lead"><i data-ic="audio-lines"></i></div>
        <div class="text"><div class="t">Sound mode</div></div>
        <div class="v">Standard</div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="timer"></i></div>
        <div class="text"><div class="t">Match screen and sound<i data-ic="info" class="info"></i></div></div>
        <div class="slider" aria-label="AV sync"><i data-ic="minus"></i><div class="track"><div class="fill" style="width:25%"></div><div class="thumb" style="left:25%"></div></div><i data-ic="plus"></i></div>
        <div class="v num" style="min-width:64px;justify-content:flex-end;color:var(--lu-ink)">0</div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="cable"></i></div>
        <div class="text"><div class="t">HDMI input audio format</div></div>
        <div class="v">Bitstream <i data-ic="chevron-right"></i></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="tv"></i></div>
        <div class="text"><div class="t">TV speakers too<i data-ic="info" class="info"></i></div></div>
        <div class="toggle" role="switch" aria-checked="false"></div>
      </div>
      <div class="row focusable" tabindex="0">
        <div class="lead"><i data-ic="square-arrow-out-up-right"></i></div>
        <div class="text"><div class="t">More in LG settings</div></div>
        <div class="v"><i data-ic="chevron-right"></i></div>
      </div>
    </div>
  </div>
</main>

<script src="icons.js"></script>
<script src="mock.js"></script>
</body>
</html>
