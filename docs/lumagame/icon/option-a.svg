<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- LumaGame, option A: three fanned game covers (2:3 glass panes) with a play notch cut
       through the front one. Same plate, panes and sheen as the LumaTV icon. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191724"/>
      <stop offset="100%" stop-color="#1f1d2e"/>
    </linearGradient>
    <linearGradient id="paneIris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4a7e7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c4a7e7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="paneFoam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ccfd8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9ccfd8" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="paneLove" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eb6f92" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#eb6f92" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0def4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e0def4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#bg)"/>
  <rect x="4" y="4" width="192" height="192" rx="40" fill="none" stroke="#26233a" stroke-width="2"/>

  <!-- covers, back to front -->
  <rect x="34" y="48" width="70" height="105" rx="14" fill="url(#paneLove)" transform="rotate(-15 69 100)"/>
  <rect x="96" y="44" width="70" height="105" rx="14" fill="url(#paneFoam)" transform="rotate(13 131 96)"/>
  <g transform="rotate(-3 104 99)">
    <rect x="64" y="40" width="80" height="120" rx="16" fill="url(#paneIris)"/>
    <path d="M72 52 L128 46 L110 66 L70 72 Z" fill="url(#sheen)"/>
    <rect x="64" y="40" width="80" height="120" rx="16" fill="none" stroke="#e0def4" stroke-opacity="0.45" stroke-width="2"/>
    <!-- play notch: the plate colour showing through the front cover -->
    <path d="M91 82 Q91 75 97.2 78.6 L122.6 93.4 Q128.6 97 122.6 100.6 L97.2 115.4 Q91 119 91 112 Z" fill="#191724" fill-opacity="0.82"/>
  </g>
</svg>
