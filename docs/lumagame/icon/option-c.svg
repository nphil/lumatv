<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- LumaGame, option C: a thumbstick seen from above, its cap a glass pane, lit from below. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191724"/>
      <stop offset="100%" stop-color="#1f1d2e"/>
    </linearGradient>
    <linearGradient id="paneIris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4a7e7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c4a7e7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="paneFoam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ccfd8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9ccfd8" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#eb6f92" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#eb6f92" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0def4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e0def4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#bg)"/>
  <rect x="4" y="4" width="192" height="192" rx="40" fill="none" stroke="#26233a" stroke-width="2"/>

  <circle cx="100" cy="108" r="70" fill="url(#glow)"/>
  <circle cx="100" cy="100" r="62" fill="url(#paneFoam)" stroke="#9ccfd8" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="100" cy="96" r="40" fill="url(#paneIris)"/>
  <circle cx="100" cy="96" r="27" fill="none" stroke="#191724" stroke-opacity="0.35" stroke-width="3"/>
  <path d="M68 84 Q78 62 104 58 L96 74 Q82 78 76 90 Z" fill="url(#sheen)"/>
  <circle cx="100" cy="96" r="40" fill="none" stroke="#e0def4" stroke-opacity="0.45" stroke-width="2"/>
</svg>
