<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LumaGame · Choose where to play</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="lumagame.css">
<script src="themes.js"></script>
</head>
<body>
<div class="screen"></div>
<script src="icons.js"></script>
<script src="kit.js"></script>
<script src="hub.js"></script>
<script>
  const { ic, chip, hints } = Kit;
  // One row per way to play Quake. Status and save compatibility come from the plugins.
  const rows = [
    { e: "gfn", sub: "nitin · Ultimate", saves: "shared", status: chip("ready"), on: true },
    { e: "sunshine", sub: "BEAST-PC · Sunshine · wakes on play", saves: "shared", status: chip("asleep"), focus: true },
    { e: "punktfunk", sub: "Punktfunk", saves: "shared", status: chip("ready") },
    { e: "native", sub: "Installed · 48 MB", saves: "separate", status: chip("installed") },
  ];
  document.querySelector(".screen").innerHTML = Hub.html("quake", { caps: ["4K", "Full controller support", "Up to 4 players"] }) + `
    <div class="scrim"></div>
    <div class="sheet-wrap"><section class="sheet dialog">
      <div class="sheet-head"><h2 class="t-title">Where to play Quake</h2></div>
      ${Hub.wayHead}
      <div class="sheet-body" data-scroll="56">
        ${rows.map(Hub.wayRow).join("")}
        <div class="srow remember"><span class="grow">Remember for this game</span><span class="toggle"></span></div>
      </div>
      <div class="sheet-foot">${hints([["key-ok", "Select"], ["key-back", "Close"]])}<span class="btn primary">${ic("play", "fill")}<span>Play here</span></span></div>
    </section></div>`;
  Kit.ready(Hub.settle);
</script>
</body>
</html>
