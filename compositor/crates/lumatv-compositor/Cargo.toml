[package]
name = "lumatv-compositor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "LumaTV's compositor: a 64-bit Wayland server for LG's webOS clients, on a private socket beside LG's surface-manager until the cutover"

[[bin]]
name = "lumatv-compositor"
path = "src/main.rs"

[[bin]]
name = "lumatv-testclient"
path = "src/bin/lumatv-testclient.rs"

# Counts system calls on the frame path with a seccomp hook, on the process's first thread (the main arena): no libtest.
[[test]]
name = "frame_syscalls"
harness = false

[dependencies]
lumatv-wl-protocols = { path = "../wl-protocols", features = ["client"] }
wayland-server = { workspace = true }
wayland-client = { workspace = true }
wayland-backend = { workspace = true }
wayland-protocols = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
png = { workspace = true }
drm = { workspace = true }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Feature `ui`: LumaTV's UI engine (the toolkit of `rustui/`, LumaShow's renderer) drawing into the compositor's pages, `src/ui`.
# The toolkit and LumaShow's crates are read by path (as `rustui/` reads them): a build, with the feature or without, needs them
# beside this repository. `ui` is named `lumashow-ui` here because `ui` is this crate's module.
lumatv-render = { path = "../../../rustui/render", optional = true }
lumashow-ui = { package = "ui", path = "../../../rustui/lumashow-ui", optional = true }
compositor-protocol = { path = "../../../rustui/compositor-protocol", optional = true }

# On the set the server runs on the C libwayland-server (loaded at run time), so the Mali blob's eglBindWaylandDisplayWL can
# serve mali_buffer_sharing on the same wl_display. Host builds and tests use the pure-Rust backend.
[target.'cfg(target_arch = "aarch64")'.dependencies]
wayland-backend = { workspace = true, features = ["server_system", "dlopen"] }

[features]
ui = ["dep:lumatv-render", "dep:lumashow-ui", "dep:compositor-protocol"]

