name: Build

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          sh -n tools/build-ipk.sh
          sh -n tools/gen-manifest.js 2>&1 | head -1 || true

      - name: Validate JSON files
        run: |
          for f in brand.json appinfo.json repo.json; do
            [ -f "$f" ] && jq . "$f" > /dev/null && echo "✓ $f" || echo "✗ $f"
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Read brand
        id: brand
        run: |
          {
            echo "appId=$(jq -r .appId brand.json)"
            echo "shortId=$(jq -r .shortId brand.json)"
            echo "displayName=$(jq -r .displayName brand.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Build IPK
        run: |
          sh tools/build-ipk.sh

      - name: Verify IPK
        run: |
          ar t ${{ steps.brand.outputs.appId }}_*.ipk
          echo "---"
          tar -tzf build/verify/data.tar.gz | head -20

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.brand.outputs.shortId }}-ipk
          path: ${{ steps.brand.outputs.appId }}_*.ipk
          if-no-files-found: error

      - name: Show build summary
        run: |
          echo "Build complete:"
          ls -lh ${{ steps.brand.outputs.appId }}_*.ipk
          sha256sum ${{ steps.brand.outputs.appId }}_*.ipk
