name: Replay receiver

on:
  push:
    branches: [main]
    paths:
      - game/replay-receiver/**
      - .gitea/workflows/replay-receiver.yml

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: git.nateshome.net
          username: nphilip89
          password: ${{ secrets.FORGE_REGISTRY_TOKEN }}

      # The Dockerfile's first stage runs the receiver's tests, so an image that fails them is never pushed.
      - uses: docker/build-push-action@v6
        with:
          context: game/replay-receiver
          platforms: linux/amd64
          push: true
          tags: |
            git.nateshome.net/nphilip89/lumagame-replay:latest
            git.nateshome.net/nphilip89/lumagame-replay:${{ github.sha }}
